name: splav
description: Offline-first trip management for kayak organizers.
publish_to: none
version: 0.7.1+8

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.6.0
  drift: ^2.32.0
  path: ^1.9.1
  sqlite3: ^3.1.0
  supabase: ^2.16.5
  uuid: ^4.5.1
  timezone: ^0.10.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
