project_id = "splav-prototype"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_stage1.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"
enable_signup = false

[auth.email]
# Enables the email provider. Global auth.enable_signup still blocks new signups.
enable_signup = true
enable_confirmations = false
